      - {tier: epique, min_days: 90, contents: "Trois mois", objectives: [sante.traitements_90j]}
      - {tier: legendaire, min_days: 180, contents: "Six mois (si le médecin l'autorise)"}

  - id: trousse_secours
    crisis: true
    group: sante
    kind: equipement
    basis: contenu
    name: Trousse de secours
    icon: 🩹
    description: "À vérifier une fois par an (dates, ciseaux, piles du thermomètre). Le matériel avancé ne sert qu'à qui a appris le geste."
    objectives: [sante.secourisme_avance]
    tiers:
      - tier: rustique
        contents: "Les soins de tous les jours"
        objectives: [sante.pharmacie_base]
        includes:
          - "Antalgique (paracétamol)"
          - "Pansements de tailles variées"
          - "Désinfectant (chlorhexidine)"
      - tier: commun
        contents: "La trousse complète recommandée"
        objectives: [sante.trousse]
        includes:
          - "Compresses stériles et bande extensible"
          - "Sparadrap"
          - "Sérum physiologique en dosettes"
          - "Solutés de réhydratation orale (SRO)"
          - "Pince à épiler et ciseaux"
          - "Gants jetables"
          - "Couverture de survie"
          - "Thermomètre"
      - tier: confirme
        contents: "Une trousse à la maison, une dans chaque sac"
        includes:
          - "Une trousse compacte dans chaque sac d'évacuation"
          - "Pansements pour ampoules et brûlures (hydrocolloïdes, compresses gel)"
          - "Bande cohésive et écharpe triangulaire"
          - "Coussin hémostatique"
          - "Fiche des gestes de premiers secours"
          - "Si le foyer compte des enfants : paracétamol en forme pédiatrique et SRO adaptés"
      - tier: epique
        contents: "Pharmacie étendue pour tenir sans pharmacie"
        objectives: [sante.pharmacie]
        includes:
          - "Antidiarrhéique (lopéramide : pas avant 15 ans, ni en cas de fièvre ou de sang dans les selles)"
          - "Antihistaminique"
          - "Anti-inflammatoire si toléré (jamais pendant la grossesse)"
          - "Sutures adhésives (Steri-Strip)"
          - "Collyre et dosettes de lavage oculaire"
          - "Crème pour brûlures et pansements gras"
          - "Réserve de désinfectant pour un mois"
      - tier: legendaire
        contents: "Prendre en charge un blessé plusieurs jours (matériel pour une personne formée)"
        includes:
          - "Garrot tourniquet et pansement compressif d'urgence, à n'utiliser qu'après une formation"
          - "Attelles malléables (SAM Splint)"
          - "Pansements hémostatiques"
          - "Oxymètre de pouls et tensiomètre"
