# Cartes de l'inventaire : équipements, consommables et réserves du foyer.
#
# Un id d'objet est stocké dans le journal (opération item.set) : il ne se renomme pas.
#
# kind :
#   equipement  : on l'a ou non, à un niveau ;
#   consommable : on l'a ou non, avec une quantité qu'on décompte ;
#   reserve     : calculée depuis les articles de la catégorie d'autonomie (`category`) ; le
#                 niveau découle des jours d'autonomie (`min_days`), il ne se choisit pas.
# basis : ce qui fait monter le niveau.
#   qualite   : un meilleur objet ;
#   options   : l'objet plus des accessoires ou des usages ;
#   quantite  : plus d'unités ou plus de jours couverts ;
#   contenu   : un contenant (sac, trousse, kit) ; chaque niveau liste dans `includes` ce qu'il
#               doit contenir au minimum EN PLUS du niveau précédent ;
#   autonomie : réserve, d'après les jours d'autonomie du foyer.
# tiers : les cinq niveaux, de rustique à légendaire, chacun avec sa description et les objectifs
#   qu'il permet de valider (les objectifs des niveaux inférieurs restent couverts).
# objectives : objectifs que l'objet aide à remplir quel que soit son niveau.
# crisis : objet à retrouver le jour J ; son emplacement s'affiche dans l'écran Crise.
# Une carte s'affiche si l'un de ses objectifs s'applique au foyer (ou si elle n'en a aucun),
# et toujours quand le foyer la possède.

tiers:
  - {id: rustique, name: Rustique}
  - {id: commun, name: Commun}
  - {id: confirme, name: Confirmé}
  - {id: epique, name: Épique}
  - {id: legendaire, name: Légendaire}

groups:
  - {id: eau, name: "Eau", icon: 💧}
  - {id: vivres, name: "Vivres et cuisine", icon: 🥫}
  - {id: sante, name: "Santé et hygiène", icon: 🩹}
  - {id: energie, name: "Énergie et lumière", icon: 🔦}
  - {id: abri, name: "Abri, chaleur et feu", icon: 🏠}
  - {id: communication, name: "Information et communication", icon: 📻}
  - {id: evacuation, name: "Évacuation et mobilité", icon: 🎒}
  - {id: papiers, name: "Papiers et argent", icon: 🗂️}
  - {id: moral, name: "Réconfort et occupation", icon: 🧸}

