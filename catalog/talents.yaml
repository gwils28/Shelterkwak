# Arbres de talents de l'onglet Compétences.
#
# Un id de talent est stocké dans le journal (opération talent.set) : il ne se renomme pas.
#
# ranks : les cinq rangs d'un arbre, de bas en haut.
# specialties : un arbre par spécialité.
#   branches : le nom de chaque colonne (une branche de l'arbre) ;
#   titles : le titre porté selon le rang le plus haut atteint dans l'arbre.
# talents :
#   row, col : place dans l'arbre (rang 1 à 5, branche à partir de 1) ;
#   criteria : ce qui prouve qu'on l'a acquis, à vérifier honnêtement avant de cocher ;
#   requires : talents à acquérir avant (tous), plus bas dans le même arbre ;
#   objectives : objectifs que ce talent aide à valider. Cocher un talent ne valide rien :
#                l'objectif garde sa propre validation (date, revalidation).

ranks: [Novice, Apprenti, Compagnon, Expert, Maître]

specialties:
  - id: physique
    name: Condition physique
    icon: 🏃
    description: "Marcher, porter, nager, tenir l'effort par tous les temps : le corps est le premier équipement en crise."
    branches: [Endurance, Force, Milieu et agilité]
    titles: [Remis en mouvement, Randonneur, Coureur des bois, Increvable, Force de la nature]

  - id: stratege
    name: Stratège de survie
    icon: 🧠
    description: "Connaître ses risques, s'informer, s'orienter, planifier : la théorie qui évite de subir."
    branches: [Risques et information, Terrain et orientation, Plans et transmission]
    titles: [Curieux, Informé, Planificateur, Stratège, Sage du quartier]

  - id: soin
    name: Soigneur
    icon: ⛑️
    description: "Alerter, secourir, soigner et soutenir : les gestes qui comptent avant l'arrivée des secours, ou quand ils ne viennent pas."
    branches: [Urgence, Soins et hygiène, Soutien psychologique]
    titles: [Témoin utile, Secouriste, Soigneur aguerri, Référent santé, Pilier santé du quartier]

  - id: brico
    name: Bricoleur
    icon: 🛠️
    description: "Réparer, entretenir, produire de l'énergie et du feu : garder la maison debout quand les artisans ne viennent plus."
    branches: [Maison, Énergie et feu, Mécanique et textile]
    titles: [Bricoleur du dimanche, Débrouillard, Artisan, Maître d'œuvre, Bâtisseur]

  - id: cuisto
    name: Cuisto
    icon: 🍳
    description: "Nourrir le foyer avec ses réserves, conserver, produire : la cuisine qui tient quand les magasins ferment."
    branches: [Cuisine de crise, Conservation, Production]
    titles: [Commis, Cuisinier du placard, Chef de crise, Maître conserveur, Nourricier]

  - id: protecteur
    name: Protecteur
    icon: 🛡️
    description: "Éviter, dissuader, se mettre à l'abri, et ne se défendre que dans le cadre de la loi : protéger les siens sans se mettre en faute."
    branches: [Évitement, Domicile, Cadre et entraînement]
    titles: [Vigilant, Veilleur, Garde, Protecteur, Bouclier du foyer]

  - id: rassembleur
    name: Rassembleur
    icon: 🤝
    description: "Dans une crise longue, le réseau compte plus que le stock : voisins, entraide, échanges."
    branches: [Voisinage, Entraide organisée, Échange]
    titles: [Bon voisin, Lien du quartier, Organisateur, Pilier, Cœur du village]

  - id: pisteur
    name: Pisteur
    icon: 🌲
    description: "Vivre dehors, trouver l'eau, le feu et la nourriture, garder le cap : l'autonomie en milieu naturel."
    branches: [Bivouac, "Eau, feu et cap", Ressources sauvages]
    titles: [Promeneur, Campeur, Trappeur, Forestier, Esprit sauvage]

  - id: transmetteur
    name: Transmetteur
    icon: 📡
    description: "S'informer, joindre les siens et relayer quand le téléphone et Internet tombent."
    branches: [Radio, Réseau du foyer, Données et maillage]
    titles: [À l'écoute, Opérateur, Relais, Maître radio, Voix du quartier]

talents:
  # ======================================================================
  # Condition physique
  # ======================================================================
  - id: physique.marche
    specialty: physique
    name: Bon marcheur
    icon: 🥾
    row: 1
    col: 1
    description: "La marche est le moyen de déplacement qui ne tombe jamais en panne."
    criteria: "Marcher 5 km d'un bon pas, sans douleur le lendemain."
    objectives: [sante.activite_reguliere]

  - id: physique.renfo
    specialty: physique
    name: Renforcement de base
    icon: 💪
    row: 1
    col: 2
    description: "Des muscles entretenus protègent le dos et les articulations quand il faut porter."
    criteria: "Un mois de renforcement au poids du corps, deux à trois séances par semaine (squats, pompes adaptées, gainage)."
    objectives: [sante.activite_reguliere]

  - id: physique.mobilite
    specialty: physique
    name: Souple et stable
    icon: 🧘
    row: 1
    col: 3
    description: "Garder l'équilibre et la souplesse évite les chutes, première cause de blessure."
    criteria: "Une routine de mobilité de 10 minutes connue, tenir 30 secondes sur un pied, se relever du sol sans appui."

  - id: physique.endurance
    specialty: physique
    name: Souffle
    icon: 🫁
    row: 2
    col: 1
    description: "Tenir l'effort sans s'épuiser, pour marcher longtemps ou aider sans s'arrêter."
    criteria: "30 minutes de course, de vélo ou de marche rapide sans s'arrêter."
    requires: [physique.marche]

  - id: physique.porteur
    specialty: physique
    name: Porteur
    icon: 🎒
    row: 2
    col: 2
    description: "Sans eau courante, on porte l'eau ; en évacuation, on porte son sac."
    criteria: "Porter 2 × 10 L d'eau sur 100 m, et un sac de 10 kg sur 5 km."
    requires: [physique.marche, physique.renfo]
    objectives: [sante.force_fonctionnelle]

  - id: physique.terrain
    specialty: physique
    name: Pied sûr
    icon: 🪨
    row: 2
    col: 3
    description: "Hors des trottoirs : sentiers, pentes, gravats, escaliers sans lumière."
    criteria: "Marcher une heure en terrain varié (sentier, pente, escaliers) avec un sac, sans chute ni torsion."
    requires: [physique.mobilite]

  - id: physique.cycliste
    specialty: physique
    name: Cycliste chargé
    icon: 🚲
    row: 3
    col: 1
    description: "Le vélo multiplie par trois ou quatre la distance parcourue à pied, sans carburant."
    criteria: "20 km à vélo avec 10 kg en sacoches, casque porté, et réparer une crevaison seul."
    requires: [physique.endurance]
    objectives: [mobilite.velo_pratique]

  - id: physique.randonneur
    specialty: physique
    name: Randonneur
    icon: 🗻
    row: 3
    col: 2
    description: "Une journée de marche chargée : de quoi rejoindre un lieu de repli proche."
    criteria: "15 km avec un sac de 10 kg dans la journée."
    requires: [physique.endurance, physique.porteur]
    objectives: [sante.condition]

  - id: physique.nageur
    specialty: physique
    name: Nageur
    icon: 🏊
    row: 4
    col: 3
    description: "En crue, savoir flotter et sortir de l'eau sauve la vie."
    criteria: "Nager 50 m, flotter 5 minutes sur place et sortir de l'eau seul (savoir-nager en sécurité)."
    requires: [physique.terrain]
    objectives: [sante.natation]

  - id: physique.longue_distance
    specialty: physique
    name: Grand marcheur
    icon: 🛣️
    row: 4
    col: 1
    description: "Quand il n'y a ni voiture ni carburant, 25 km séparent souvent de l'aide."
    criteria: "25 km dans la journée avec le sac d'évacuation, sans blessure, pieds soignés à l'arrivée."
    requires: [physique.cycliste, physique.randonneur]

  - id: physique.brancardier
    specialty: physique
    name: Brancardier
    icon: 🛏️
    row: 4
    col: 2
    description: "Déplacer un blessé ou une personne qui ne peut plus marcher, sans se blesser soi-même."
    criteria: "Porter un adulte à deux sur 100 m avec un brancard improvisé (couverture, bâtons), et ne le déplacer seul sur quelques mètres que face à un danger vital immédiat (feu, effondrement)."
    requires: [physique.randonneur]

  - id: physique.climat
    specialty: physique
    name: Effort par tous les temps
    icon: 🌡️
    row: 3
    col: 3
    description: "En canicule comme en grand froid, l'effort mal géré devient dangereux."
    criteria: "Savoir s'hydrater, ralentir et s'arrêter à temps ; reconnaître un coup de chaleur et une hypothermie, chez soi et chez les autres."
    requires: [physique.endurance]

  - id: physique.maitre
    specialty: physique
    name: Condition entretenue
    icon: 🏆
    row: 5
    col: 2
    description: "Une forme qui ne dépend pas d'une salle de sport et tient dans la durée."
    criteria: "Un an de pratique régulière (trois séances par semaine) et le test complet réussi dans le mois : 25 km chargé, un adulte porté, 50 m nagés."
    requires: [physique.longue_distance, physique.brancardier, physique.nageur]

  # ======================================================================
  # Stratège de survie
  # ======================================================================
  - id: stratege.risques
    specialty: stratege
    name: Connaître ses risques
    icon: 🗺️
    row: 1
    col: 1
    description: "On se prépare à ce qui peut vraiment arriver chez soi."
    criteria: "Le DICRIM de la commune et la fiche Géorisques de l'adresse lus, les risques du foyer listés."
    objectives: [securite.risques]

  - id: stratege.carte
    specialty: stratege
    name: Lire une carte
    icon: 🧾
    row: 1
    col: 2
    description: "Sans GPS, la carte papier reste lisible."
    criteria: "Situer sa maison, son travail et l'école sur une carte papier, lire la légende d'une carte IGN ; deux itinéraires d'évacuation et un lieu de rassemblement tracés et connus du foyer."
    objectives: [mobilite.itineraires]

  - id: stratege.guide
    specialty: stratege
    name: Le guide lu
    icon: 📖
    row: 1
    col: 3
    description: "Les bases officielles : quoi faire avant, pendant et après."
    criteria: "Un guide officiel de préparation aux urgences lu en entier."
    objectives: [competences.guide]

  - id: stratege.veille
    specialty: stratege
    name: Veille et alertes
    icon: 📡
    row: 2
    col: 1
    description: "Être prévenu tôt, par des sources fiables, et ne pas relayer les rumeurs."
    criteria: "FR-Alert, Vigicrues et la vigilance Météo-France connus ; une liste de sources fiables et le réflexe de vérifier avant de partager."
    requires: [stratege.risques]
    objectives: [securite.alertes, communication.sources, securite.pcs]

  - id: stratege.boussole
    specialty: stratege
    name: Carte et boussole
    icon: 🧭
    row: 2
    col: 2
    description: "Garder le cap la nuit, dans le brouillard ou hors des routes connues."
    criteria: "Suivre un azimut et rejoindre un point à 2 km avec une carte et une boussole."
    requires: [stratege.carte]
    objectives: [mobilite.orientation]

  - id: stratege.plan_familial
    specialty: stratege
    name: Plan familial
    icon: 📝
    row: 2
    col: 3
    description: "Chacun sait quoi faire, où se retrouver et qui appeler, même séparé."
    criteria: "Plan écrit et partagé : points de rendez-vous, contacts, rôles de chacun, enfants à l'école."
    requires: [stratege.guide]
    objectives: [securite.plan_familial]

  - id: stratege.scenarios
    specialty: stratege
    name: Scénarios de crise
    icon: 🎲
    row: 3
    col: 1
    description: "Réfléchir à froid aux 72 premières heures de chaque crise probable."
    criteria: "Pour chaque risque majeur du foyer, un scénario écrit des 72 premières heures : quoi faire, qui, avec quoi."
    requires: [stratege.veille, stratege.plan_familial]

  - id: stratege.itineraires
    specialty: stratege
    name: Itinéraires reconnus
    icon: 🛤️
    row: 3
    col: 2
    description: "Un itinéraire tracé sur une carte ne vaut que s'il a été parcouru."
    criteria: "Deux itinéraires d'évacuation vers le lieu de repli reconnus sur le terrain, dont un à pied."
    requires: [stratege.boussole]

  - id: stratege.bibliotheque
    specialty: stratege
    name: Savoir des livres
    icon: 📚
    row: 3
    col: 3
    description: "Apprendre avant d'en avoir besoin, dans des livres qui marchent sans réseau."
    criteria: "Secourisme, jardinage et réparations étudiés dans des livres papier gardés à la maison."
    requires: [stratege.plan_familial]
    objectives: [competences.bibliotheque]

  - id: stratege.decision
    specialty: stratege
    name: Partir ou rester
    icon: ⚖️
    row: 4
    col: 1
    description: "La décision la plus lourde d'une crise se prépare à froid, pas dans l'urgence."
    criteria: "Des critères écrits à l'avance pour évacuer ou rester (alertes, seuils, signes sur le terrain), connus de tous les adultes du foyer."
    requires: [stratege.scenarios]
    objectives: [mobilite.criteres_depart]

  - id: stratege.exercice
    specialty: stratege
    name: Exercice grandeur nature
    icon: 🎯
    row: 4
    col: 2
    description: "Un plan non testé est une hypothèse."
    criteria: "Un exercice de 24 heures sans réseau organisé pour le foyer, suivi d'un retour d'expérience écrit."
    requires: [stratege.scenarios, stratege.itineraires]
    objectives: [securite.exercice_24h, securite.retex]

  - id: stratege.transmettre
    specialty: stratege
    name: Transmettre
    icon: 🎓
    row: 4
    col: 3
    description: "Un quartier préparé protège mieux qu'un foyer préparé seul."
    criteria: "Une séance de sensibilisation animée (voisins, école, association), avec les bases de la préparation."
    requires: [stratege.bibliotheque]
    objectives: [competences.transmettre]

  - id: stratege.maitre
    specialty: stratege
    name: Résilience locale
    icon: 🏛️
    row: 5
    col: 2
    description: "Penser à l'échelle de la commune, avec ceux qui organisent les secours."
    criteria: "Participer au plan communal de sauvegarde, à la réserve communale de sécurité civile ou à un plan commun de quartier."
    requires: [stratege.decision, stratege.exercice, stratege.transmettre]
    objectives: [securite.plan_commun]

  # ======================================================================
  # Soigneur
  # ======================================================================
  - id: soin.alerter
    specialty: soin
    name: Alerter
    icon: 📞
    row: 1
    col: 1
    description: "Une bonne alerte fait gagner de précieuses minutes aux secours."
    criteria: "Connaître le 15, le 18, le 112 et le 114 (SMS) ; savoir donner l'adresse exacte, décrire la situation et rester en ligne."
    objectives: [sante.numeros_urgence]

  - id: soin.petits_soins
    specialty: soin
    name: Petits soins
    icon: 🩹
    row: 1
    col: 2
    description: "Les petites plaies mal soignées s'infectent quand on ne peut pas voir un médecin."
    criteria: "Nettoyer et panser une plaie, retirer une écharde ou une tique, connaître le contenu de sa trousse."

  - id: soin.respiration
    specialty: soin
    name: Garder son calme
    icon: 🌬️
    row: 1
    col: 3
    description: "On ne peut aider personne en paniquant."
    criteria: "Une technique de respiration (inspirer 4 s, expirer 6 s) pratiquée et montrée au foyer."
    objectives: [moral.stress]

  - id: soin.gqs
    specialty: soin
    name: Gestes qui sauvent
    icon: 🫀
    row: 2
    col: 1
    description: "Deux heures pour apprendre à arrêter une hémorragie et masser un cœur."
    criteria: "Formation « Gestes qui sauvent » suivie (2 h, gratuite) ou mieux."
    requires: [soin.alerter]
    objectives: [sante.gestes_qui_sauvent]

  - id: soin.hygiene
    specialty: soin
    name: Hygiène de crise
    icon: 🧼
    row: 2
    col: 2
    description: "Sans eau courante, les maladies viennent de l'eau, des mains et des toilettes."
    criteria: "Rendre une eau potable (ébullition, chlore, filtre), se laver les mains avec peu d'eau, gérer des toilettes sèches."
    requires: [soin.petits_soins]
    objectives: [eau.savoir_traiter]

  - id: soin.ecoute
    specialty: soin
    name: Écoute
    icon: 👂
    row: 2
    col: 3
    description: "Accueillir la peur ou la détresse d'un proche sans juger ni conseiller trop vite."
    criteria: "Savoir écouter quelqu'un en détresse, reformuler, et orienter vers le 3114 ou un professionnel si besoin."
    requires: [soin.respiration]
    objectives: [moral.ecoute]

  - id: soin.psc1
    specialty: soin
    name: Secouriste PSC1
    icon: ⛑️
    row: 3
    col: 1
    description: "La formation de référence aux premiers secours."
    criteria: "PSC1 (ou équivalent) obtenu, recyclé au moins tous les trois ans."
    requires: [soin.gqs]
    objectives: [sante.psc1]

  - id: soin.pharmacie
    specialty: soin
    name: Pharmacie de famille
    icon: 💊
    row: 3
    col: 2
    description: "Bien utiliser la trousse, c'est surtout connaître les doses et les contre-indications."
    criteria: "Doses adultes, et doses enfants selon le poids, des médicaments de la trousse connues, contre-indications notées, liste des traitements du foyer à jour."
    requires: [soin.hygiene]

  - id: soin.pssm
    specialty: soin
    name: Secouriste en santé mentale
    icon: 🧠
    row: 3
    col: 3
    description: "Les premiers secours, version santé mentale : crise d'angoisse, idées suicidaires, choc."
    criteria: "Formation Premiers secours en santé mentale (PSSM) suivie."
    requires: [soin.ecoute]
    objectives: [moral.pssm]

  - id: soin.isole
    specialty: soin
    name: Secours en milieu isolé
    icon: 🏔️
    row: 4
    col: 1
    description: "Quand les secours mettent des heures à venir : surveiller, immobiliser, évacuer."
    criteria: "PSE1 ou formation de secourisme en milieu isolé (WFA) obtenue."
    requires: [soin.psc1]
    objectives: [sante.secourisme_avance]

  - id: soin.plantes
    specialty: soin
    name: Plantes médicinales
    icon: 🌿
    row: 4
    col: 2
    description: "Des remèdes simples pour les petits maux, avec leurs dangers."
    criteria: "Reconnaître et utiliser dix plantes médicinales courantes de sa région, en connaissant leurs sosies toxiques et leurs contre-indications ; jamais à la place d'un traitement, et prudence pour la grossesse, les enfants et les traitements en cours."
    requires: [soin.pharmacie]
    objectives: [sante.plantes]

  - id: soin.debriefing
    specialty: soin
    name: Après le choc
    icon: 🗣️
    row: 4
    col: 3
    description: "Après un événement, repérer ceux qui vont mal et organiser la parole."
    criteria: "Savoir organiser un temps de parole après un événement et repérer qui a besoin d'une aide professionnelle."
    requires: [soin.pssm]
    objectives: [moral.debriefing, moral.reperer]

  - id: soin.maitre
    specialty: soin
    name: Référent santé
    icon: ⚕️
    row: 5
    col: 2
    description: "La personne vers qui le quartier se tourne quand quelqu'un est blessé."
    criteria: "Secouriste bénévole dans une association agréée (PSE2), ou membre de la réserve sanitaire ou communale."
    requires: [soin.isole, soin.debriefing]

  # ======================================================================
  # Bricoleur
  # ======================================================================
  - id: brico.coupures
    specialty: brico
    name: Couper l'essentiel
    icon: 🔧
    row: 1
    col: 1
    description: "Fuite, inondation, incendie : le premier geste est de couper."
    criteria: "Couper l'eau, le gaz et l'électricité en moins de deux minutes, même de nuit."
    objectives: [abri.coupures]

  - id: brico.feu
    specialty: brico
    name: Faire du feu
    icon: 🔥
    row: 2
    col: 2
    description: "Chaleur, cuisson, eau bouillie : le feu reste la base, s'il est maîtrisé."
    criteria: "Allumer et entretenir un feu en sécurité, à l'endroit autorisé, et l'éteindre complètement."
    requires: [brico.rechaud]
    objectives: [competences.feu]

  - id: brico.couture
    specialty: brico
    name: Coudre
    icon: 🧵
    row: 1
    col: 3
    description: "Un vêtement réparé est un vêtement qu'on n'a pas à racheter."
    criteria: "Recoudre un bouton, faire un ourlet, refermer un accroc à la main."

  - id: brico.reparations
    specialty: brico
    name: Petites réparations
    icon: 🪛
    row: 2
    col: 1
    description: "Les dépannages qui évitent d'attendre un artisan."
    criteria: "Changer un joint de robinet, remplacer une prise ou un interrupteur au disjoncteur coupé, fixer solidement une étagère."
    requires: [brico.coupures]
    objectives: [abri.reparations]

  - id: brico.rechaud
    specialty: brico
    name: Combustion en sécurité
    icon: 🏕️
    row: 1
    col: 2
    description: "Le monoxyde de carbone tue chaque hiver pendant les coupures."
    criteria: "Utiliser réchaud, poêle et groupe électrogène sans risque de monoxyde de carbone : jamais en pièce close, aération, détecteur."
    objectives: [competences.rechaud]

  - id: brico.textile
    specialty: brico
    name: Réparer les textiles
    icon: 🧶
    row: 2
    col: 3
    description: "Vêtements, bâches, sacs, tentes : tout s'use plus vite en crise."
    criteria: "Rapiécer un vêtement, réparer une bâche ou une sangle de sac, à la main ou à la machine."
    requires: [brico.couture]
    objectives: [competences.couture]

  - id: brico.plomberie
    specialty: brico
    name: Plomberie
    icon: 🚿
    row: 3
    col: 1
    description: "Une fuite non réparée, c'est de l'eau perdue et un logement abîmé."
    criteria: "Réparer une fuite sur un raccord, déboucher une évacuation, vidanger un circuit avant le gel."
    requires: [brico.reparations]

  - id: brico.bois
    specialty: brico
    name: Bois de chauffage
    icon: 🪓
    row: 3
    col: 2
    description: "Le bois ne chauffe bien que sec : il se prépare un ou deux ans à l'avance."
    criteria: "Fendre, empiler et faire sécher le bois ; mesurer son humidité ; entretenir un poêle et faire ramoner."
    requires: [brico.feu]

  - id: brico.velo
    specialty: brico
    name: Mécanique vélo
    icon: 🚲
    row: 3
    col: 3
    description: "Un vélo entretenu reste le transport le plus sûr quand le carburant manque."
    criteria: "Réparer une crevaison, régler freins et dérailleur, changer une chaîne."
    requires: [brico.reparations]

  - id: brico.installations
    specialty: brico
    name: Installations autonomes
    icon: 🔋
    row: 4
    col: 1
    description: "Eau et électricité qui ne dépendent pas du réseau, installées proprement."
    criteria: "Chiffrer ses besoins en Wh par jour, raccorder un panneau, un régulateur et une batterie, poser un récupérateur d'eau raccordé."
    requires: [brico.plomberie]
    objectives: [energie.bilan_wh]

  - id: brico.tronconneuse
    specialty: brico
    name: Tronçonneuse
    icon: 🪵
    row: 4
    col: 2
    description: "Un arbre en travers de la route au troisième jour d'isolement."
    criteria: "Formation suivie, dégager un arbre tombé avec casque à visière, jambières anti-coupure et gants."
    contexts: [periurbain, rural]
    requires: [brico.bois]
    objectives: [competences.tronconneuse]

  - id: brico.mecanique
    specialty: brico
    name: Mécanique de base
    icon: ⚙️
    row: 4
    col: 3
    description: "Garder en état la voiture, le groupe électrogène ou la tondeuse."
    criteria: "Changer une roue, vérifier niveaux et batterie, faire la vidange et changer la bougie d'un petit moteur."
    requires: [brico.velo]

  - id: brico.maitre
    specialty: brico
    name: Savoir-faire échangeable
    icon: 🏗️
    row: 5
    col: 2
    description: "Un savoir-faire assez solide pour dépanner les autres, et l'échanger."
    criteria: "Un artisanat ou une compétence technique pratiqué au point de réparer pour les voisins (menuiserie, plomberie, mécanique, couture)."
    requires: [brico.installations, brico.tronconneuse, brico.mecanique]
    objectives: [competences.echangeable]

  # ======================================================================
  # Cuisto
  # ======================================================================
  - id: cuisto.sans_cuisson
    specialty: cuisto
    name: Repas sans cuisson
    icon: 🥫
    row: 1
    col: 1
    description: "Les premiers jours d'une coupure, on mange sans gaz ni électricité."
    criteria: "Préparer trois jours de repas équilibrés sans aucune cuisson, avec ce qu'il y a dans les réserves."
    objectives: [alimentation.sans_cuisson]

  - id: cuisto.rotation
    specialty: cuisto
    name: Rotation des stocks
    icon: 🔄
    row: 1
    col: 2
    description: "Une réserve qu'on mange et qu'on renouvelle ne périme jamais."
    criteria: "Premier entré, premier sorti : les réserves se consomment dans l'ordre des dates et se rachètent au fur et à mesure."
    objectives: [alimentation.rotation]

  - id: cuisto.semis
    specialty: cuisto
    name: Premiers semis
    icon: 🌱
    row: 1
    col: 3
    description: "Commencer petit : un balcon suffit."
    criteria: "Faire pousser des aromatiques ou des salades jusqu'à la récolte."

  - id: cuisto.rechaud
    specialty: cuisto
    name: Cuisine au réchaud
    icon: 🔥
    row: 2
    col: 1
    description: "Un vrai repas chaud remonte le moral, s'il est cuisiné sans danger."
    criteria: "Cuisiner un repas complet pour le foyer au réchaud ou au feu, dehors ou fenêtre ouverte."
    requires: [cuisto.sans_cuisson]

  - id: cuisto.securite
    specialty: cuisto
    name: Sécurité des aliments
    icon: 🧊
    row: 2
    col: 2
    description: "En coupure, l'intoxication alimentaire est un vrai risque."
    criteria: "Connaître les durées sans courant (environ 4 h pour le frigo, 24 à 48 h pour un congélateur fermé), quoi jeter, et écarter les boîtes bombées."
    requires: [cuisto.rotation]

  - id: cuisto.potager
    specialty: cuisto
    name: Potager de base
    icon: 🥕
    row: 2
    col: 3
    description: "Cinq légumes bien maîtrisés valent mieux qu'un grand potager raté."
    criteria: "Cultiver au moins cinq légumes de base jusqu'à la récolte (stage, jardin partagé ou chez soi)."
    requires: [cuisto.semis]
    objectives: [alimentation.potager_savoir]

  - id: cuisto.semaine
    specialty: cuisto
    name: Une semaine sur les réserves
    icon: 📅
    row: 3
    col: 1
    description: "Le seul vrai test d'une réserve : en vivre."
    criteria: "Cuisiner une semaine entière uniquement avec ses réserves, sans courses."
    requires: [cuisto.rechaud]
    objectives: [competences.cuisine_stock]

  - id: cuisto.conserves
    specialty: cuisto
    name: Conserves
    icon: 🫙
    row: 3
    col: 2
    description: "Garder les récoltes et les promotions des mois durant."
    criteria: "Stériliser des bocaux, lacto-fermenter et déshydrater, en respectant les temps et températures d'une recette fiable ; connaître le botulisme (légumes peu acides, viande, poisson) : couvercle bombé ou odeur suspecte, on jette sans goûter."
    requires: [cuisto.securite]
    objectives: [alimentation.conservation]

  - id: cuisto.semences
    specialty: cuisto
    name: Semences
    icon: 🌾
    row: 3
    col: 3
    description: "Des graines reproductibles, c'est le potager de l'année suivante."
    criteria: "Récolter, sécher et garder les graines d'au moins trois légumes reproductibles, et les ressemer."
    requires: [cuisto.potager]
    objectives: [alimentation.semences]

  - id: cuisto.sobre
    specialty: cuisto
    name: Cuisson sobre
    icon: ♨️
    row: 4
    col: 1
    description: "Deux à trois fois moins de combustible : la réserve dure d'autant plus."
    criteria: "Cuisiner régulièrement à la marmite norvégienne, à l'autocuiseur ou au cuiseur solaire."
    requires: [cuisto.semaine]
    objectives: [energie.cuisson_sobre]

  - id: cuisto.conservation_longue
    specialty: cuisto
    name: Conservation sans froid
    icon: 🥓
    row: 4
    col: 2
    description: "Les techniques d'avant le frigo : sel, fumée, cave."
    criteria: "Saler, fumer ou sécher viande et poisson, et garder des légumes tout l'hiver en cave ou en silo, en suivant des recettes fiables (sel, nitrites, températures) pour éviter le botulisme."
    requires: [cuisto.conserves]

  - id: cuisto.elevage
    specialty: cuisto
    name: Petit élevage
    icon: 🐔
    row: 4
    col: 3
    description: "Quelques poules donnent des œufs toute l'année et mangent les restes."
    criteria: "S'occuper de poules (ou de lapins) toute une année : nourriture, soins, abri, protection contre les prédateurs."
    contexts: [periurbain, rural]
    requires: [cuisto.semences]
    objectives: [alimentation.elevage]

  - id: cuisto.maitre
    specialty: cuisto
    name: Nourrir le foyer
    icon: 🍲
    row: 5
    col: 2
    description: "Produire, conserver et cuisiner une bonne part de ce qu'on mange."
    criteria: "Une année où le foyer a produit, conservé et cuisiné la moitié de ses légumes, avec des repas de crise maîtrisés."
    requires: [cuisto.sobre, cuisto.conservation_longue, cuisto.elevage]
    objectives: [alimentation.production_50]

  # ======================================================================
  # Protecteur
  # ======================================================================
  - id: protecteur.fuir
    specialty: protecteur
    name: Fuir et alerter
    icon: 🏃
    row: 1
    col: 1
    description: "La première défense est de ne pas être là."
    criteria: "Règle connue de tout le foyer : face à une agression, on fuit et on alerte (17 ou 112, SMS au 114) ; aucun bien ne vaut un risque."
    objectives: [defense.fuir_alerter]

  - id: protecteur.issues
    specialty: protecteur
    name: Connaître ses issues
    icon: 🚪
    row: 1
    col: 2
    description: "Savoir par où sortir, de jour comme de nuit, avant d'en avoir besoin."
    criteria: "Issues de secours du logement et de l'immeuble repérées par tous ; clés, papiers, téléphone et chaussures toujours au même endroit près de la sortie."
    objectives: [abri.issues, mobilite.depart_rapide]

  - id: protecteur.loi
    specialty: protecteur
    name: Légitime défense
    icon: 📜
    row: 1
    col: 3
    description: "Ce que la loi permet, et surtout ce qu'elle ne permet pas."
    criteria: "Chaque adulte connaît les conditions de la légitime défense : attaque injuste et actuelle, riposte nécessaire, immédiate et proportionnée ; défendre un bien seul ne justifie jamais un geste qui peut tuer. Numéros contre les violences connus : 17 ou 112, SMS au 114, 3919, 119."
    objectives: [defense.legitime_defense, defense.violences]

  - id: protecteur.vigilance
    specialty: protecteur
    name: Vigilance
    icon: 👀
    row: 2
    col: 1
    description: "La plupart des agressions s'évitent avant le premier contact."
    criteria: "Repérer les signaux d'une situation qui dégénère, garder la distance, ne pas s'isoler, poser sa voix pour dissuader : pratiqué au quotidien."
    requires: [protecteur.fuir]
    objectives: [defense.evitement]

  - id: protecteur.discretion
    specialty: protecteur
    name: Discrétion
    icon: 🤫
    row: 2
    col: 2
    description: "Des réserves que tout le monde connaît attirent ceux qui n'en ont pas."
    criteria: "Règle familiale de discrétion sur les réserves et l'équipement, respectée en ligne comme dans le voisinage."
    requires: [protecteur.issues]
    objectives: [securite.discretion]

  - id: protecteur.apres
    specialty: protecteur
    name: Après une agression
    icon: 🧾
    row: 2
    col: 3
    description: "Ce qu'on fait juste après compte pour la victime comme pour la justice."
    criteria: "Conduite connue : se mettre en sûreté, appeler le 17, ne pas poursuivre, noter les témoins, certificat médical, plainte, France Victimes (116 006)."
    requires: [protecteur.loi]
    objectives: [defense.apres_agression]

  - id: protecteur.desescalade
    specialty: protecteur
    name: Désescalade
    icon: 🕊️
    row: 3
    col: 1
    description: "Faire retomber la tension plutôt que gagner la confrontation."
    criteria: "Savoir calmer un conflit : voix posée, distance, laisser une sortie à l'autre, ne pas humilier ; formation ou atelier suivi."
    requires: [protecteur.vigilance]
    objectives: [securite.desescalade]

  - id: protecteur.intrusion
    specialty: protecteur
    name: Plan intrusion
    icon: 🔐
    row: 3
    col: 2
    description: "De nuit chez soi, le plus sûr reste de s'enfermer et d'appeler."
    criteria: "Pièce refuge qui ferme à clé, téléphone chargé à l'intérieur, consigne de ne pas aller au contact ; exercice fait en famille."
    requires: [protecteur.discretion]
    objectives: [defense.intrusion, defense.exercice_intrusion]

  - id: protecteur.initiation
    specialty: protecteur
    name: Self-défense
    icon: 🥋
    row: 3
    col: 3
    description: "Se dégager et fuir, pas combattre."
    criteria: "Initiation encadrée suivie (dégagements, chutes, protection), adaptée si besoin (défense assise, canne)."
    requires: [protecteur.apres]
    objectives: [defense.initiation, defense.initiation_adaptee]

  - id: protecteur.vulnerables
    specialty: protecteur
    name: Protéger les plus fragiles
    icon: 🧒
    row: 4
    col: 1
    description: "Les enfants et les personnes vulnérables ont besoin de consignes à leur mesure."
    criteria: "Consignes apprises par les enfants (adultes de confiance, « un secret qui fait peur se dit », crier et fuir, le 119)."
    requires: [protecteur.desescalade]
    objectives: [defense.enfants]

  - id: protecteur.voisinage
    specialty: protecteur
    name: Veille de voisinage
    icon: 🏘️
    row: 4
    col: 2
    description: "Une intrusion vue et signalée par les voisins s'arrête souvent d'elle-même."
    criteria: "Signal d'alerte convenu avec les voisins (appel, SMS groupé, sifflet) et entraide prévue en cas d'agression ou d'intrusion."
    requires: [protecteur.intrusion]
    objectives: [defense.voisinage, securite.veille]

  - id: protecteur.pratique
    specialty: protecteur
    name: Gestes entretenus
    icon: 🔁
    row: 4
    col: 3
    description: "Un geste appris une fois s'oublie sous le stress."
    criteria: "Gestes de self-défense entretenus au moins deux fois par an (stage, séances en club, révision encadrée)."
    requires: [protecteur.initiation]
    objectives: [defense.pratique, defense.pratique_adaptee]

  - id: protecteur.maitre
    specialty: protecteur
    name: Transmettre la protection
    icon: 🛡️
    row: 5
    col: 2
    description: "Un foyer où chacun sait éviter, alerter et se mettre à l'abri."
    criteria: "Savoir transmettre au foyer l'évitement, les dégagements et les règles de la légitime défense, et l'avoir fait ; mise en situation encadrée suivie."
    requires: [protecteur.vulnerables, protecteur.voisinage, protecteur.pratique]
    objectives: [defense.transmission, defense.mise_en_situation]

  # ======================================================================
  # Rassembleur
  # ======================================================================
  - id: rassembleur.voisins
    specialty: rassembleur
    name: Connaître ses voisins
    icon: 👋
    row: 1
    col: 1
    description: "En crise, l'aide la plus rapide vient de la porte d'à côté."
    criteria: "Connaître au moins deux voisins par leur nom et avoir échangé les numéros."
    objectives: [communaute.voisins]

  - id: rassembleur.proche
    specialty: rassembleur
    name: Contacts d'urgence
    icon: 📇
    row: 1
    col: 2
    description: "Quelqu'un de proche qui peut venir, et quelqu'un de loin que tout le monde peut joindre."
    criteria: "Un proche à moins de 30 minutes prévenu qu'il est le contact d'urgence, et un contact hors de la région connu de tous les membres."
    objectives: [communaute.proche_joignable, communication.contact_externe]

  - id: rassembleur.service
    specialty: rassembleur
    name: Rendre service
    icon: 🎁
    row: 1
    col: 3
    description: "L'entraide commence par donner, avant d'en avoir besoin."
    criteria: "Avoir proposé et rendu un service concret à un voisin (courses, garde, outil prêté, coup de main)."

  - id: rassembleur.fragiles
    specialty: rassembleur
    name: Repérer les fragiles
    icon: 🫶
    row: 2
    col: 1
    description: "En canicule ou en coupure, les personnes isolées sont les premières en danger."
    criteria: "Savoir qui, autour de soi, est âgé, malade, isolé ou dépendant d'un appareil, et comment le joindre."
    requires: [rassembleur.voisins]
    objectives: [communaute.fragiles]

  - id: rassembleur.binome
    specialty: rassembleur
    name: Foyer binôme
    icon: 🤜
    row: 2
    col: 2
    description: "Deux foyers qui s'épaulent tiennent bien plus longtemps qu'un seul."
    criteria: "Accord d'entraide réciproque avec un autre foyer : hébergement, garde des enfants, partage des réserves."
    requires: [rassembleur.proche]
    objectives: [communaute.binome]

  - id: rassembleur.annuaire
    specialty: rassembleur
    name: Qui sait quoi
    icon: 📒
    row: 2
    col: 3
    description: "Savoir à qui demander : l'infirmière, le mécanicien, la voisine qui a un puits."
    criteria: "Un annuaire des compétences et des ressources de son réseau, tenu sur papier."
    requires: [rassembleur.service]
    objectives: [communaute.annuaire]

  - id: rassembleur.tournee
    specialty: rassembleur
    name: Tournée de nouvelles
    icon: 🚶
    row: 3
    col: 1
    description: "Passer voir, frapper à la porte, rappeler : c'est souvent ce qui sauve en canicule."
    criteria: "Une tournée organisée auprès des voisins fragiles pendant une canicule, un grand froid ou une coupure, avec les rôles répartis."
    requires: [rassembleur.fragiles]

  - id: rassembleur.groupe
    specialty: rassembleur
    name: Groupe d'entraide
    icon: 👥
    row: 3
    col: 2
    description: "Un petit groupe de foyers qui se sont mis d'accord à l'avance."
    criteria: "Groupe d'entraide d'au moins trois foyers avec un plan commun (qui aide qui, où se retrouver, quoi mettre en commun)."
    requires: [rassembleur.binome]
    objectives: [communaute.groupe]

  - id: rassembleur.troc
    specialty: rassembleur
    name: Troc et échange
    icon: 🔄
    row: 3
    col: 3
    description: "Quand l'argent manque ou ne sert plus, on échange des biens et des savoir-faire."
    criteria: "Participer à un réseau d'échange local : SEL, gratiferia, troc, monnaie locale."
    requires: [rassembleur.annuaire]
    objectives: [communaute.troc]

  - id: rassembleur.reunion
    specialty: rassembleur
    name: Animer une réunion
    icon: 🗣️
    row: 4
    col: 1
    description: "Faire décider un groupe sans que la réunion tourne au conflit."
    criteria: "Avoir animé une réunion de voisins ou d'association : ordre du jour, tour de parole, décisions écrites, désaccords apaisés."
    requires: [rassembleur.tournee]

  - id: rassembleur.engagement
    specialty: rassembleur
    name: Engagement local
    icon: 🚒
    row: 4
    col: 2
    description: "Être du côté de ceux qui organisent les secours."
    criteria: "Engagé dans la réserve communale de sécurité civile, chez les pompiers volontaires ou dans une association de secours."
    requires: [rassembleur.groupe]
    objectives: [communaute.engagement]

  - id: rassembleur.mutualiser
    specialty: rassembleur
    name: Mutualiser
    icon: 🧺
    row: 4
    col: 3
    description: "Une tronçonneuse, un groupe électrogène, un jardin : pas besoin que chacun ait tout."
    criteria: "Outils, stocks ou jardin mis en commun avec d'autres foyers, avec des règles d'usage écrites."
    requires: [rassembleur.troc]
    objectives: [communaute.mutualisation]

  - id: rassembleur.maitre
    specialty: rassembleur
    name: Communauté résiliente
    icon: 🌳
    row: 5
    col: 2
    description: "Faire grandir la préparation autour de soi."
    criteria: "Porter un projet de résilience locale (jardin partagé, réserve communale, plan de quartier) ou accompagner un autre foyer jusqu'au niveau Paré."
    requires: [rassembleur.reunion, rassembleur.engagement, rassembleur.mutualiser]
    objectives: [communaute.resilience_locale, communaute.parrainage]

  # ======================================================================
  # Pisteur
  # ======================================================================
  - id: pisteur.noeuds
    specialty: pisteur
    name: Nœuds de base
    icon: 🪢
    row: 1
    col: 1
    description: "Quatre nœuds suffisent pour tendre une bâche, attacher une charge ou assurer quelqu'un."
    criteria: "Faire sans hésiter un nœud de chaise, un cabestan, un nœud de tension réglable et un nœud plat."

  - id: pisteur.eau
    specialty: pisteur
    name: Trouver l'eau
    icon: 🏞️
    row: 1
    col: 2
    description: "Savoir où chercher l'eau autour de chez soi et de ses itinéraires."
    criteria: "Deux sources d'eau brute repérées et accessibles (rivière, source, fontaine), en sachant qu'elle se traite toujours avant de boire."
    objectives: [eau.sources_identifiees]

  - id: pisteur.observer
    specialty: pisteur
    name: Lire la nature
    icon: 🔍
    row: 1
    col: 3
    description: "Reconnaître ce qui pousse et sentir le temps qui tourne."
    criteria: "Reconnaître dix arbres et plantes courantes de sa région, et les signes d'un orage qui arrive (nuages, vent, pression)."

  - id: pisteur.abri
    specialty: pisteur
    name: Abri de bâche
    icon: ⛺
    row: 2
    col: 1
    description: "Un toit en quinze minutes avec une bâche et une cordelette."
    criteria: "Monter seul un abri de bâche tendu et étanche en moins de 15 minutes."
    requires: [pisteur.noeuds]

  - id: pisteur.traiter
    specialty: pisteur
    name: Eau traitée
    icon: 💧
    row: 2
    col: 2
    description: "Une eau claire peut rendre gravement malade."
    criteria: "Préfiltrer, filtrer puis désinfecter une eau brute (ébullition, chlore ou filtre adapté), en connaissant les limites de chaque méthode."
    requires: [pisteur.eau]
    objectives: [eau.savoir_traiter]

  - id: pisteur.cueillette
    specialty: pisteur
    name: Cueillette sûre
    icon: 🫐
    row: 2
    col: 3
    description: "Des plantes sauvages en complément, jamais au hasard."
    criteria: "Reconnaître dix plantes sauvages comestibles et leurs sosies toxiques ; cueillir seulement ce qu'on identifie à coup sûr, là où c'est autorisé."
    requires: [pisteur.observer]

  - id: pisteur.nuit
    specialty: pisteur
    name: Nuit dehors
    icon: 🌙
    row: 3
    col: 1
    description: "Dormir au chaud et au sec quand il fait froid, c'est d'abord une question d'isolation du sol."
    criteria: "Passer une nuit dehors sous les 5 °C, au sec et au chaud, avec son matériel."
    requires: [pisteur.abri]

  - id: pisteur.feu
    specialty: pisteur
    name: Feu sous la pluie
    icon: 🌧️
    row: 3
    col: 2
    description: "Allumer un feu quand tout est mouillé, là où c'est permis."
    criteria: "Allumer et entretenir un feu avec du bois humide, sans allume-feu industriel, dans un lieu autorisé, et l'éteindre complètement."
    requires: [pisteur.abri]

  - id: pisteur.champignons
    specialty: pisteur
    name: Champignons
    icon: 🍄
    row: 3
    col: 3
    description: "Quelques espèces bien connues, et les mortelles par cœur."
    criteria: "Identifier quelques champignons comestibles sûrs et les espèces mortelles de sa région ; toujours faire vérifier par un pharmacien ou une société mycologique."
    requires: [pisteur.cueillette]

  - id: pisteur.bivouac
    specialty: pisteur
    name: Bivouac de 48 h
    icon: 🏕️
    row: 4
    col: 1
    description: "Deux jours en autonomie avec ce qu'on porte."
    criteria: "Deux jours et deux nuits en autonomie en nature avec son sac, dans le respect des règles du bivouac, sans laisser de trace."
    requires: [pisteur.nuit]

  - id: pisteur.cap
    specialty: pisteur
    name: S'orienter sans boussole
    icon: 🌄
    row: 4
    col: 3
    description: "Retrouver une direction quand on n'a plus rien."
    criteria: "Trouver le nord avec le soleil, une montre ou les étoiles, et rejoindre une route en suivant le relief et les cours d'eau."
    requires: [pisteur.observer]

  - id: pisteur.peche
    specialty: pisteur
    name: Pêche
    icon: 🎣
    row: 4
    col: 2
    description: "Une source de protéines, dans le respect des règles."
    criteria: "Pêcher avec une carte de pêche, dans les périodes et tailles autorisées ; vider et cuire un poisson."
    requires: [pisteur.feu]

  - id: pisteur.maitre
    specialty: pisteur
    name: Autonomie en nature
    icon: 🦉
    row: 5
    col: 2
    description: "Une semaine dehors, sans dépendre d'un commerce."
    criteria: "Une semaine en itinérance ou en bivouac avec ce qu'on porte, eau traitée et feu maîtrisé, dans le respect de la réglementation."
    requires: [pisteur.bivouac, pisteur.cap, pisteur.peche]

  # ======================================================================
  # Transmetteur
  # ======================================================================
  - id: transmetteur.ecoute
    specialty: transmetteur
    name: À l'écoute
    icon: 📻
    row: 1
    col: 1
    description: "En coupure, la radio FM reste la voix des autorités."
    criteria: "Radio à piles ou à dynamo testée, fréquence de la radio publique locale notée sur papier."
    objectives: [communication.radio, communication.frequence]

  - id: transmetteur.contacts
    specialty: transmetteur
    name: Contacts sur papier
    icon: 📇
    row: 1
    col: 2
    description: "Un téléphone vide ou perdu, et plus aucun numéro en tête."
    criteria: "Contacts essentiels notés sur papier, à la maison et dans chaque sac."
    objectives: [communication.contacts_papier]

  - id: transmetteur.sauvegarde
    specialty: transmetteur
    name: Sauvegarder
    icon: 💾
    row: 1
    col: 3
    description: "Papiers, photos, contacts : ce qui n'est que dans le téléphone peut disparaître avec lui."
    criteria: "Documents importants sauvegardés hors ligne (clé ou disque chiffré), et une copie hors de la maison."
    objectives: [cyber.sauvegarde, cyber.restauration]

  - id: transmetteur.talkies
    specialty: transmetteur
    name: Talkies-walkies
    icon: 📟
    row: 2
    col: 1
    description: "Garder le contact dans le quartier sans réseau."
    criteria: "Talkies PMR446 du foyer : canal convenu, portée testée, procédure connue (indicatif, parler court, « à vous »)."
    requires: [transmetteur.ecoute]
    objectives: [communication.talkies]

  - id: transmetteur.plan
    specialty: transmetteur
    name: Plan de communication
    icon: 🗓️
    row: 2
    col: 2
    description: "Quand le réseau sature, les SMS passent souvent mieux que les appels."
    criteria: "Plan connu de tous : qui appelle qui, SMS plutôt qu'appel, horaires et fréquences convenus avec les proches."
    requires: [transmetteur.contacts]

  - id: transmetteur.hors_ligne
    specialty: transmetteur
    name: Tout hors ligne
    icon: 🗺️
    row: 2
    col: 3
    description: "Cartes, guides et fiches utiles sans Internet."
    criteria: "Cartes de la région, guides de secourisme et fiches du foyer disponibles hors ligne sur téléphone et ordinateur, vérifiés en mode avion."
    requires: [transmetteur.sauvegarde]

  - id: transmetteur.cb
    specialty: transmetteur
    name: CB et antenne
    icon: 📡
    row: 3
    col: 1
    description: "La CB porte plus loin que les talkies, sans licence."
    criteria: "Poste CB opérationnel, antenne réglée, canaux d'appel et d'urgence connus, un essai de contact réussi ; fréquences et horaires de vacation convenus avec les proches."
    requires: [transmetteur.talkies]
    objectives: [communication.radio_emission, communication.reseau_local]

  - id: transmetteur.messages
    specialty: transmetteur
    name: Messages d'urgence
    icon: ✉️
    row: 3
    col: 2
    description: "Un message clair se transmet mieux et se comprend du premier coup."
    criteria: "Rédiger un message court et complet (qui, où, quoi, quel besoin, à quelle heure) et le faire passer par SMS, radio ou papier."
    requires: [transmetteur.plan]

  - id: transmetteur.maille
    specialty: transmetteur
    name: Réseau maillé
    icon: 🕸️
    row: 3
    col: 3
    description: "Des messages qui passent d'appareil en appareil, sans opérateur."
    criteria: "Une messagerie maillée (type LoRa) installée et testée entre au moins deux foyers."
    requires: [transmetteur.hors_ligne]

  - id: transmetteur.licence
    specialty: transmetteur
    name: Radioamateur
    icon: 🎙️
    row: 4
    col: 1
    description: "Émettre loin quand les réseaux sont tombés, dans un cadre légal."
    criteria: "Licence de radioamateur obtenue."
    requires: [transmetteur.cb]
    objectives: [communication.licence]

  - id: transmetteur.relais
    specialty: transmetteur
    name: Relayer l'information
    icon: 📢
    row: 4
    col: 2
    description: "Être celui qui transmet les consignes vérifiées, pas les rumeurs."
    criteria: "Relayer les informations officielles vérifiées pour le quartier (affichage, radio, messages), avec une liste de sources fiables."
    requires: [transmetteur.messages]
    objectives: [communication.relais, communication.sources]

  - id: transmetteur.energie
    specialty: transmetteur
    name: Tenir sans réseau
    icon: 🔋
    row: 4
    col: 3
    description: "Une radio sans batterie ne sert à rien."
    criteria: "Radios, téléphones et réseau maillé alimentés une semaine hors réseau (solaire, batteries), testé."
    requires: [transmetteur.maille]

  - id: transmetteur.maitre
    specialty: transmetteur
    name: Réseau de secours
    icon: 🗼
    row: 5
    col: 2
    description: "Le quartier reste joint quand tout le reste est tombé."
    criteria: "Réseau radio de secours avec le groupe d'entraide, plan de fréquences et d'horaires, testé au moins tous les six mois."
    requires: [transmetteur.licence, transmetteur.relais, transmetteur.energie]
    objectives: [communication.reseau_teste]
