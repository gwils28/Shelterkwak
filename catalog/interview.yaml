# Interview d'inscription : questions posées dans l'ordre, filtrées par `show_if`.
# Effets d'une option : `validates` (objectifs déjà acquis), `tags` (tags du foyer),
# `sets` (champs du foyer). Une question `number` peut créer un article
# d'inventaire initial via `creates_stock` ; `amount_per_unit: household_day`
# convertit des « jours pour le foyer » en unité de base (kcal par exemple).
# `show_if` accepte `context_in`, `tags_any` et `answer: {question, includes}`.
questions:
  - id: risques
    section: Ton environnement
    type: multi
    text: Quels risques concernent ta commune ?
    help: Si tu ne sais pas, consulte georisques.gouv.fr ou le DICRIM de ta mairie ; tu pourras compléter plus tard.
    options:
      - {value: inondation, label: Inondation, tags: [risque_inondation], validates: [securite.risques]}
      - {value: froid, label: Hivers rigoureux, tags: [risque_froid], validates: [securite.risques]}
      - {value: industriel, label: Site industriel ou nucléaire proche, tags: [risque_industriel], validates: [securite.risques]}
      - {value: seisme, label: Séisme, tags: [risque_seisme], validates: [securite.risques]}
      - {value: incendie, label: Feux de forêt, tags: [risque_incendie], validates: [securite.risques]}
      - {value: canicule, label: Canicules, tags: [risque_canicule], validates: [securite.risques]}
      - {value: secheresse, label: Sécheresse et restrictions d'eau, tags: [risque_secheresse], validates: [securite.risques]}
      - {value: inconnu, label: Je ne sais pas encore}

  - id: climat
    section: Ton environnement
    type: single
    text: Quel climat a ta région ?
    options:
      - {value: oceanique, label: "Océanique (hivers doux, pluie)"}
      - {value: continental, label: Continental (hivers froids), tags: [risque_froid]}
      - {value: mediterraneen, label: Méditerranéen (étés chauds et secs), tags: [risque_canicule, risque_secheresse]}
      - {value: montagne, label: Montagne, tags: [climat_montagne, risque_froid]}

  - id: inquietudes
    section: Ton environnement
    type: multi
    text: Quelles situations t'inquiètent le plus ?
    options:
      - {value: coupures, label: Coupures d'eau ou d'électricité longues, tags: [inquietude_coupures]}
      - {value: eco, label: "Crise économique, perte d'emploi", tags: [inquietude_economie]}
      - {value: climat, label: Événements climatiques extrêmes, tags: [inquietude_climat]}
      - {value: pandemie, label: Pandémie, tags: [inquietude_pandemie]}
      - {value: penuries, label: Pénuries et ruptures d'approvisionnement, tags: [inquietude_penuries]}
      - {value: troubles, label: Troubles civils ou conflit, tags: [inquietude_troubles]}

  - id: vehicule
    section: Ton environnement
    type: single
    text: Le foyer dispose-t-il d'un véhicule à moteur ?
    options:
      - {value: oui, label: Oui, tags: [vehicule]}
      - {value: non, label: Non}

  - id: etage
    section: Ton environnement
    type: single
    show_if: {context_in: [appartement]}
    text: À quel étage vis-tu ?
    help: Au-dessus du premier, l'eau et les courses se montent à pied quand l'ascenseur et le surpresseur s'arrêtent.
    options:
      - {value: bas, label: Rez-de-chaussée ou premier étage}
      - {value: haut, label: Deuxième étage ou plus, tags: [etage]}

  - id: chauffage
    section: Ton environnement
    type: single
    text: Comment ton logement est-il chauffé principalement ?
    help: Un chauffage au bois impose le ramonage dès maintenant et une réserve de bois sec.
    options:
      - {value: reseau, label: "Gaz de ville, électricité ou chauffage collectif"}
      - {value: bois, label: "Poêle, cheminée ou chaudière à bois", tags: [chauffage_bois]}
      - {value: combustible, label: "Fioul ou gaz en citerne", tags: [chauffage_combustible]}

  - id: eau_quotidienne
    section: Ton environnement
    type: single
    show_if: {context_in: [periurbain, rural]}
    text: Quelle eau bois-tu au quotidien ?
    options:
      - {value: reseau, label: L'eau du robinet (réseau public)}
      - {value: puits, label: "L'eau d'un puits, d'un forage ou d'une source privée", tags: [puits]}

  - id: eau_litres
    section: Tes réserves
    type: number
    text: Combien de litres d'eau en bouteille as-tu aujourd'hui chez toi ?
    help: Compte large (packs, bidons). Tu affineras ensuite dans l'inventaire.
    unit: litres
    creates_stock: {category: eau, name: Eau stockée (estimation de l'interview), unit_label: L, amount_per_unit: 1}

  - id: vivres_jours
    section: Tes réserves
    type: number
    text: Combien de jours pourrais-tu nourrir tout le foyer sans faire de courses ?
    unit: jours
    creates_stock: {category: alimentation, name: Placards (estimation de l'interview), unit_label: jour foyer, amount_per_unit: household_day}

  - id: cuisson_jours
    section: Tes réserves
    type: number
    text: Pendant combien de jours pourrais-tu cuisiner sans gaz ni électricité du réseau (réchaud, cartouches, bois) ?
    unit: jours
    creates_stock: {category: cuisson, name: Combustible de cuisson (estimation de l'interview), unit_label: jour foyer, amount_per_unit: household_day}

  - id: traitements_jours
    section: Tes réserves
    type: number
    show_if: {tags_any: [traitement_medical]}
    text: Combien de jours de traitement médical as-tu d'avance ?
    unit: jours
    creates_stock: {category: traitements, name: Traitements (estimation de l'interview), unit_label: jour foyer, amount_per_unit: household_day}

  - id: bases
    section: Tes bases
    type: multi
    text: Qu'est-ce qui est déjà vrai chez toi ?
    help: Le strict minimum pour passer quelques heures de coupure.
    options:
      - {value: lumiere, label: Une lampe sans réseau à un endroit connu de tous, validates: [energie.lumiere]}
      - {value: numeros, label: Tout le monde connaît les numéros d'urgence, validates: [sante.numeros_urgence]}
      - {value: pharmacie, label: "Antalgique, pansements et désinfectant", validates: [sante.pharmacie_base]}
      - {value: issues, label: Issues de secours repérées, validates: [abri.issues]}
      - {value: reflexes, label: On connaît les réflexes en cas d'alerte, validates: [securite.reflexes]}
      - {value: frequence, label: Fréquence de la radio publique notée, validates: [communication.frequence]}
      - {value: papiers_ranges, label: Papiers d'identité rangés au même endroit, validates: [finances.papiers_ranges]}
      - {value: depart, label: "Clés, papiers et chaussures près de la sortie", validates: [mobilite.depart_rapide]}
      - {value: guide, label: J'ai lu un guide officiel de préparation, validates: [competences.guide]}
      - {value: proche, label: Un proche à moins de 30 min prévenu, validates: [communaute.proche_joignable]}

  - id: crue
    section: Tes bases
    type: single
    show_if: {tags_any: [risque_inondation]}
    text: Tout le foyer sait-il qu'on ne traverse jamais une zone inondée, ni à pied ni en voiture ?
    help: 30 cm d'eau suffisent à emporter une voiture.
    options:
      - {value: oui, label: Oui, validates: [securite.crue]}
      - {value: non, label: Pas encore}

  - id: equipement
    section: Ton équipement
    type: multi
    text: Qu'as-tu déjà chez toi, en état de marche ?
    options:
      - {value: lampes, label: Lampes frontales ou torches et piles, validates: [energie.lampes]}
      - {value: trousse, label: Trousse de premiers secours à jour, validates: [sante.trousse]}
      - {value: radio, label: Radio à piles ou dynamo, validates: [communication.radio]}
      - {value: pastilles, label: Pastilles de purification d'eau, validates: [eau.pastilles]}
      - {value: bidons, label: Bidons alimentaires vides, validates: [eau.contenants]}
      - {value: filtre, label: Filtre à eau portable, validates: [eau.filtre]}
      - {value: ouvre_boite, label: Ouvre-boîte manuel, validates: [alimentation.ouvre_boite]}
      - {value: sans_cuisson, label: 3 jours d'aliments sans cuisson, validates: [alimentation.sans_cuisson]}
      - {value: batterie, label: Batteries externes chargées, validates: [energie.batterie]}
      - {value: solaire, label: Panneau solaire portable, validates: [energie.solaire_portable]}
      - {value: station, label: Station électrique portable, validates: [energie.station]}
      - {value: couvertures, label: Couvertures de survie ou duvets pour tous, validates: [abri.chaleur]}
      - {value: detecteurs, label: Détecteurs de fumée testés, validates: [abri.detecteurs]}
      - {value: extincteur, label: Extincteur, validates: [abri.extincteur]}
      - {value: hygiene, label: Kit d'hygiène de 3 jours, validates: [sante.hygiene_3j]}
      - {value: toilettes, label: Toilettes de secours, validates: [sante.toilettes]}
      - {value: masques, label: Stock de masques FFP2, validates: [sante.masques]}
      - {value: sac, label: Sacs d'évacuation prêts, validates: [mobilite.sac]}
      - {value: talkies, label: Talkies-walkies, validates: [communication.talkies]}
      - {value: cartes, label: Cartes papier de la région, validates: [communication.cartes]}
      - {value: confinement, label: "Kit de confinement (bâches, adhésif)", validates: [abri.calfeutrage]}

  - id: organisation
    section: Ton organisation
    type: multi
    text: Qu'est-ce qui est déjà en place dans le foyer ?
    options:
      - {value: coupures, label: "On sait couper eau, gaz et électricité", validates: [eau.robinet_arret, abri.coupures]}
      - {value: alertes, label: FR-Alert et alertes préfecture activés, validates: [securite.alertes]}
      - {value: plan, label: Un plan familial d'urgence écrit, validates: [securite.plan_familial]}
      - {value: exercice, label: Un exercice d'évacuation chronométré dans l'année, validates: [securite.exercice]}
      - {value: exercice_24h, label: Un exercice de 24 h sans réseau dans l'année, validates: [securite.exercice_24h]}
      - {value: contacts, label: Contacts essentiels sur papier, validates: [communication.contacts_papier]}
      - {value: contact_externe, label: Un contact référent hors région, validates: [communication.contact_externe]}
      - {value: itineraires, label: Itinéraires d'évacuation connus, validates: [mobilite.itineraires]}
      - {value: accueil, label: Un lieu d'accueil convenu hors zone, validates: [mobilite.accueil]}
      - {value: papiers, label: Copies des papiers importants, validates: [finances.papiers]}
      - {value: especes, label: Des espèces d'avance, validates: [finances.especes]}
      - {value: assurances, label: Assurances vérifiées récemment, validates: [finances.assurances]}
      - {value: fiches, label: Fiches médicales des membres, validates: [sante.fiches]}
      - {value: inventaire, label: Inventaire des placards fait, validates: [alimentation.inventaire]}
      - {value: rotation, label: Rotation des stocks alimentaires, validates: [alimentation.rotation]}
      - {value: cles, label: Doubles des clés en lieu sûr, validates: [securite.cles]}
      - {value: ecoute, label: Numéros d'écoute notés, validates: [moral.ecoute]}
      - {value: pcs, label: Plan communal de sauvegarde consulté, validates: [securite.pcs]}
      - {value: stress, label: "Une technique de gestion du stress connue (respiration, cohérence cardiaque)", validates: [moral.stress]}
      - {value: verrouillage, label: "Téléphones et ordinateurs verrouillés par un code", validates: [cyber.verrouillage]}
      - {value: double_auth, label: "Double authentification sur la messagerie et la banque", validates: [cyber.double_auth]}
      - {value: sauvegarde, label: "Sauvegarde récente des fichiers sur un support hors ligne", validates: [cyber.sauvegarde]}

  - id: competences
    section: Tes compétences
    type: multi
    text: Quelles compétences sont présentes dans le foyer (pratiquées ces deux dernières années) ?
    help: Répondre à cette question vaut bilan des compétences du foyer, même si tu ne coches rien.
    answered_validates: [competences.bilan]
    options:
      - {value: gestes, label: Formation « Gestes qui sauvent » (2 h), validates: [sante.gestes_qui_sauvent]}
      - {value: psc1, label: Premiers secours (PSC1), validates: [sante.psc1, sante.gestes_qui_sauvent]}
      - {value: secourisme, label: "Secourisme avancé (PSE1, WFA)", validates: [sante.secourisme_avance]}
      - {value: feu, label: Faire un feu en sécurité, validates: [competences.feu]}
      - {value: rechaud, label: "Utiliser un réchaud en sécurité (aération, jamais en pièce fermée)", validates: [competences.rechaud]}
      - {value: eau, label: Traiter une eau douteuse, validates: [eau.savoir_traiter]}
      - {value: conserves, label: "Conserves, fermentation ou séchage", validates: [alimentation.conservation]}
      - {value: potager, label: Cultiver un potager, validates: [alimentation.potager_savoir]}
      - {value: cuisine_stock, label: Cuisiner avec ses seules réserves, validates: [competences.cuisine_stock]}
      - {value: bricolage, label: Petites réparations du logement, validates: [abri.reparations]}
      - {value: orientation, label: Orientation carte et boussole, validates: [mobilite.orientation]}
      - {value: desescalade, label: "Gestion de conflit, désescalade", validates: [securite.desescalade]}
      - {value: radio, label: Radioamateur, validates: [communication.licence]}
      - {value: condition, label: Marcher 15 km avec un sac, validates: [sante.condition]}
      - {value: natation, label: Les adultes savent nager, validates: [sante.natation]}
      - {value: natation_enfants, label: Les enfants ont appris ou apprennent à nager, validates: [sante.natation_enfants]}
      - {value: force, label: "Se relever du sol, porter 2 × 10 L d'eau sur 100 m, monter 5 étages chargé", validates: [sante.force_fonctionnelle]}
      - {value: bouger, label: "Bouger régulièrement (sport, marche, jardin, bois)", validates: [sante.activite_reguliere]}
      - {value: velo, label: "Faire 20 km à vélo chargé et réparer une crevaison", validates: [mobilite.velo_pratique]}

  - id: armes
    section: Ta défense
    type: single
    text: Le foyer détient-il des armes à feu (chasse ou tir sportif) ?
    help: "Sert seulement à te proposer les règles de détention. Comme tes autres réponses, elle est enregistrée sur tes appareils et sur ton serveur de synchronisation."
    options:
      - {value: non, label: Non}
      - {value: oui, label: Oui, tags: [armes]}

  - id: defense
    section: Ta défense
    type: multi
    text: Qu'est-ce qui est déjà vrai pour te défendre en cas d'agression ?
    help: Dans le cadre de la loi française. Fuir et alerter reste toujours la première défense.
    options:
      - {value: fuir, label: "Règle du foyer : on fuit et on alerte d'abord", validates: [defense.fuir_alerter]}
      - {value: legitime, label: Les adultes connaissent les conditions de la légitime défense, validates: [defense.legitime_defense]}
      - {value: apres, label: "On sait quoi faire après une agression (17, certificat médical, plainte)", validates: [defense.apres_agression]}
      - {value: violences, label: "Les adultes connaissent les recours contre les violences dans le foyer (3919, 119, SMS 114)", validates: [defense.violences]}
      - {value: intrusion, label: Plan intrusion au domicile avec pièce refuge, validates: [defense.intrusion]}
      - {value: initiation, label: Un adulte a suivi une initiation à la self-défense, validates: [defense.initiation, defense.initiation_adaptee]}
      - {value: pratique, label: Un adulte pratique un sport de combat en club depuis un an ou plus, validates: [defense.pratique, defense.pratique_adaptee]}
      - {value: armes_regle, label: "Armes rangées en règle (SIA, coffre, munitions à part)", validates: [defense.armes_regle]}

  - id: epargne
    section: Tes finances
    type: single
    text: Combien de mois de dépenses courantes couvre ton épargne de précaution ?
    options:
      - {value: "0", label: Aucune}
      - {value: "lt1", label: Moins d'un mois}
      - {value: "1", label: 1 à 3 mois, validates: [finances.epargne_1m]}
      - {value: "3", label: 3 à 6 mois, validates: [finances.epargne_1m, finances.epargne_3m]}
      - {value: "6", label: 6 mois ou plus, validates: [finances.epargne_1m, finances.epargne_3m, finances.epargne_6m]}

  - id: credit
    section: Tes finances
    type: single
    text: As-tu un crédit à la consommation en cours (hors immobilier) ?
    options:
      - {value: oui, label: Oui}
      - {value: non, label: Non, validates: [finances.sans_credit_conso]}

  - id: production
    section: Ton autonomie
    type: multi
    show_if: {context_in: [periurbain, rural]}
    text: Qu'as-tu déjà sur ton terrain ?
    options:
      - {value: recuperateur, label: Récupérateur d'eau de pluie (500 L ou plus), validates: [eau.recuperateur]}
      - {value: puits, label: "Puits, forage ou citerne de 5 m³ ou plus", validates: [eau.source_autonome]}
      - {value: potager, label: Des légumes du jardin à table au moins quatre mois par an, validates: [alimentation.potager]}
      - {value: groupe, label: Groupe électrogène ou solaire de secours, validates: [energie.secours]}
      - {value: solaire, label: Installation solaire avec batteries, validates: [energie.solaire_fixe]}
      - {value: bois, label: Poêle à bois et deux hivers de bois d'avance, validates: [energie.bois]}
      - {value: toilettes_seches, label: Toilettes sèches et compost, validates: [sante.assainissement]}

  - id: production_ville
    section: Ton autonomie
    type: multi
    show_if: {context_in: [appartement]}
    text: Qu'as-tu déjà, même sans terrain ?
    options:
      - {value: jardin, label: "Un balcon cultivé, un jardin partagé ou une parcelle", validates: [alimentation.balcon]}
      - {value: kit_balcon, label: Un kit solaire de balcon avec batterie, validates: [energie.kit_balcon]}

  - id: reseau
    section: Ton réseau
    type: multi
    text: Et côté entourage ?
    options:
      - {value: voisins, label: Je connais au moins deux voisins par leur nom, validates: [communaute.voisins]}
      - {value: fragiles, label: Je sais qui est fragile autour de moi, validates: [communaute.fragiles]}
      - {value: binome, label: Un foyer ami avec qui on s'entraide, validates: [communaute.binome]}
      - {value: groupe, label: Un groupe d'entraide de plusieurs foyers, validates: [communaute.groupe]}
      - {value: producteurs, label: Je connais des producteurs locaux en direct, validates: [alimentation.circuit_court]}
      - {value: engagement, label: "Je suis engagé localement (réserve, pompiers, association)", validates: [communaute.engagement]}

  - id: objectif_niveau
    section: Tes objectifs
    type: single
    text: Quel palier veux-tu atteindre en priorité ?
    options:
      - {value: "3", label: "72 heures : faire face à une coupure courte", sets: {goal_level: 3}}
      - {value: "4", label: "Deux semaines : tenir un confinement ou une crise locale", sets: {goal_level: 4}}
      - {value: "5", label: "Trois mois : traverser une crise longue", sets: {goal_level: 5}}
      - {value: "6", label: "Six mois et savoir-faire", sets: {goal_level: 6}}
      - {value: "7", label: "Semi-autonomie : produire une partie de mes besoins", sets: {goal_level: 7}}
      - {value: "8", label: "Autonomie complète et communauté", sets: {goal_level: 8}}
      - {value: "9", label: "Anti-fragilité : ressortir plus fort de chaque crise", sets: {goal_level: 9}}

  - id: horizon
    section: Tes objectifs
    type: single
    text: En combien de temps ?
    options:
      - {value: "3", label: 3 mois, sets: {goal_horizon_months: 3}}
      - {value: "6", label: 6 mois, sets: {goal_horizon_months: 6}}
      - {value: "12", label: 1 an, sets: {goal_horizon_months: 12}}
      - {value: "24", label: 2 ans, sets: {goal_horizon_months: 24}}
      - {value: "60", label: 5 ans, sets: {goal_horizon_months: 60}}

  - id: axes_prioritaires
    section: Tes objectifs
    type: multi
    text: Sur quels axes veux-tu progresser en premier ?
    help: Ils remonteront en tête de ta checklist.
    options_from: axes
    sets_list: priority_axes
