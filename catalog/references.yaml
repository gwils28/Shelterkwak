# Repères d'achat par carte et palier, tenus à jour par « la revue du marché » (le Fourrier).
# Qualité d'abord, prix secondaire (surtout aux paliers élevés) ; marchés France, Europe, États-Unis.
# Une entrée par carte et palier : critères durables, puis 2 ou 3 modèles dont le premier est le
# choix du Fourrier ; `market` : france, europe ou usa ; `checked` = dernière vérification en ligne.
# Sources : docs/marche/AAAA-MM-JJ.md. Jamais de réserve, ni de contenu de pharmacie, ni d'arme.

references:

  - item: pastilles_eau
    tier: commun
    criteria: "Un désinfectant reconnu (NaDCC ou dioxyde de chlore) avec un dosage clair par litre, en blister individuel qui se conserve plusieurs années ; les pastilles à l'argent seul ne désinfectent pas."
    checked: 2026-11-09
    refs:
      - {brand: "Katadyn", model: "Micropur Forte MF 1T (100 comprimés)", price: "20-25 €", market: france, why: "Chlore NaDCC pour désinfecter plus argent pour conserver, un comprimé par litre, 100 L par boîte, référence des voyageurs."}
      - {brand: "Aquatabs", model: "Comprimés effervescents 1 L (3,5 mg, boîte de 60)", price: "12-17 €", market: france, why: "NaDCC vendu en pharmacie, utilisé par les ONG humanitaires, 60 L par boîte."}
      - {brand: "Katadyn", model: "Micropur MP1 (30 comprimés)", price: "14-18 $", market: usa, why: "Dioxyde de chlore, actif aussi sur Cryptosporidium (4 h de contact) et sans goût de chlore, mais 30 L seulement par boîte."}
