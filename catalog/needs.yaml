# Catégories d'inventaire suivies en jours d'autonomie.
# daily_need : besoin journalier par type de membre, dans l'unité de base.
# per_household : besoin forfaitaire par jour pour tout le foyer (si le foyer compte un humain).
# per_member_tag : 1 par jour pour chaque membre qui porte ce tag (traitements : un jour de
#   traitement par membre traité).
# Cuisson : en jours-personne ; une cartouche de gaz de 250 g fait environ 3 jours-personne.
categories:
  - id: eau
    name: Eau potable
    unit: L
    daily_need: {adulte: 4, senior: 4, enfant: 2.5, bebe: 2, animal: 1, animal_petit: 0.3, animal_grand: 2}
  - id: alimentation
    name: Nourriture
    unit: kcal
    daily_need: {adulte: 2200, senior: 1900, enfant: 1700, bebe: 900}
  - id: traitements
    name: Traitements médicaux
    unit: jour
    per_member_tag: traitement_medical
    applies_if: traitement_medical
  - id: cuisson
    name: Combustible de cuisson hors réseau
    unit: jour-personne
    daily_need: {adulte: 1, senior: 1, enfant: 0.7, bebe: 0.3}
