# Tags déduits automatiquement des membres du foyer
member_tags:
  enfant: enfants
  bebe: bebe
  senior: seniors
  animal: animaux
  animal_petit: animaux
  animal_grand: animaux

# Particularités de santé ou physiques d'un membre (humain). Chacune ajoute ses tags
# au foyer, ce qui rend applicables les objectifs qui les demandent (`requires_tags`).
# Un id se garde : il est stocké dans le journal (membre.conditions).
member_conditions:
  - id: traitement
    name: Traitement médical régulier
    tags: [traitement_medical]
  - id: vue
    name: Lunettes ou lentilles de correction
    tags: [correction_vue]
  - id: audition
    name: Appareil auditif
    tags: [appareil_auditif]
  - id: mobilite_reduite
    name: Mobilité réduite (canne, déambulateur, fauteuil)
    tags: [mobilite_reduite]
  - id: appareil_electrique
    name: Appareil médical électrique (respirateur, PPC, concentrateur d'oxygène)
    tags: [appareil_electrique]
  - id: insuline
    name: Diabète traité par insuline
    tags: [diabete_insuline, traitement_medical]
  - id: allergie_severe
    name: Allergie sévère avec stylo d'adrénaline
    tags: [allergie_severe]
  - id: respiratoire
    name: Asthme ou maladie respiratoire
    tags: [respiratoire]
  - id: regime
    name: Régime alimentaire strict (cœliaquie, allergie alimentaire)
    tags: [regime_special]
  - id: grossesse
    name: Grossesse en cours
    tags: [grossesse]
  - id: accompagnement
    name: Besoin d'accompagnement (troubles cognitifs, autisme, Alzheimer)
    tags: [accompagnement]
