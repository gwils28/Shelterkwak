axis: securite
objectives:
  - id: securite.risques
    level: 2
    title: Connaître les risques de sa commune (DICRIM, Géorisques)
    revalidate_days: 1095
  - id: securite.alertes
    level: 2
    title: Recevoir les alertes officielles (FR-Alert activé, Vigilance Météo-France, Vigicrues, alertes de la préfecture)
  - id: securite.plan_familial
    level: 3
    title: Plan familial d'urgence écrit (qui fait quoi, points de rendez-vous)
    revalidate_days: 365
  - id: securite.cles
    level: 2
    title: Doubles des clés et cache sûre pour les objets essentiels
  - id: securite.exercice
    excludes_tags: [mobilite_reduite]
    level: 4
    title: Exercice d'évacuation chronométré - tout le foyer dehors en moins de 15 min, sacs pris
    why: Un plan jamais testé est une hypothèse.
    revalidate_days: 365
  - id: securite.discretion
    level: 4
    required: false
    title: Règle familiale de discrétion sur les réserves
  - id: securite.logement
    level: 5
    title: Logement sécurisé sans gros travaux (serrure certifiée A2P, entrebâilleur, éclairage extérieur ou détecteur)
  - id: securite.incendie_ext
    due_month: 6
    level: 5
    requires_tags: [risque_incendie]
    contexts: [periurbain, rural]
    title: Débroussaillement réglementaire fait avant l'été et plan de défense incendie
  - id: securite.desescalade
    level: 6
    kind: skill
    title: Gestion de conflit et désescalade
    revalidate_days: 730
  - id: securite.veille
    level: 7
    title: Veille de voisinage organisée
  - id: securite.plan_commun
    level: 8
    title: Plan de sécurité partagé avec le réseau local
    revalidate_days: 365
  - id: securite.retex
    level: 9
    title: Retour d'expérience écrit après chaque incident ou exercice, et plan amélioré en conséquence
    why: C'est le cœur de l'anti-fragilité - chaque choc, même petit, laisse le foyer plus solide qu'avant.
    revalidate_days: 180
  - id: securite.reflexes
    level: 1
    title: Connaître les réflexes officiels en cas d'alerte (se mettre à l'abri, s'informer, ne pas aller chercher les enfants à l'école)
    why: Ce sont les consignes diffusées par les sirènes et FR-Alert ; les connaître évite les mauvais réflexes.
  - id: securite.exercice_24h
    level: 4
    title: Exercice de 24 h sans réseau (eau, électricité et téléphone coupés volontairement)
    why: L'évacuation et la coupure ne testent pas les mêmes choses ; il faut faire les deux.
    revalidate_days: 365
  - id: securite.iode
    level: 2
    requires_tags: [risque_industriel]
    title: Comprimés d'iode retirés en pharmacie pour chaque membre si le foyer est dans le périmètre d'une centrale nucléaire
    why: Pris sur consigne de la préfecture, ils protègent la thyroïde, surtout celle des enfants.
  - id: securite.ecole
    level: 2
    requires_tags: [enfants]
    title: Personnes autorisées à récupérer les enfants déclarées à l'école, et consignes du plan de mise en sûreté (PPMS) connues
    why: En alerte, l'école garde les enfants à l'abri ; aller les chercher expose tout le monde.
  - id: securite.dechets
    level: 4
    title: Gestion des déchets si la collecte s'arrête (sacs résistants, bacs fermés, lieu de stockage à l'écart du logement)
    why: En quelques jours sans collecte, les déchets attirent nuisibles et maladies.
  - id: securite.pcs
    level: 2
    title: Plan communal de sauvegarde consulté (points de rassemblement, d'hébergement et de distribution d'eau de la commune)
  - id: securite.porte_blindee
    level: 6
    required: false
    title: Porte blindée ou bloc-porte certifié A2P (à voir avec le propriétaire pour un locataire)
