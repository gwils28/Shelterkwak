axis: energie
objectives:
  - id: energie.lampes
    level: 2
    title: Une lampe frontale ou torche par personne, avec piles de rechange
  - id: energie.cuisson_3j
    level: 3
    kind: stock
    title: Moyen de cuisson hors réseau et combustible pour 3 jours
    stock: {category: cuisson, min_days: 3}
  - id: energie.batterie
    level: 3
    title: Batteries externes chargées pour les téléphones
    revalidate_days: 90
  - id: energie.cuisson_14j
    level: 4
    kind: stock
    title: Combustible de cuisson pour 14 jours
    stock: {category: cuisson, min_days: 14}
  - id: energie.solaire_portable
    level: 4
    title: Panneau solaire portable pour recharger les petits appareils, testé
    revalidate_days: 365
  - id: energie.station
    level: 5
    title: Station électrique portable (500 Wh ou plus) rechargeable au solaire, testée
    revalidate_days: 180
  - id: energie.cuisson_90j
    level: 5
    kind: stock
    title: Combustible de cuisson pour 90 jours
    stock: {category: cuisson, min_days: 90}
    contexts: [periurbain, rural]
  - id: energie.bilan_wh
    level: 4
    title: Besoins électriques prioritaires chiffrés en Wh par jour
    why: On ne choisit ni panneau ni station sans savoir ce qu'ils doivent alimenter.
  - id: energie.secours
    level: 6
    contexts: [periurbain, rural]
    title: Groupe électrogène ou solaire de secours, carburant stocké, testé
    revalidate_days: 180
  - id: energie.kit_balcon
    level: 7
    contexts: [appartement]
    title: Kit solaire de balcon avec batterie couvrant éclairage et communications
  - id: energie.solaire_fixe
    level: 7
    contexts: [periurbain, rural]
    title: Installation solaire avec stockage couvrant les besoins prioritaires
  - id: energie.bois
    due_month: 11
    why: Du bois coupé dans l'année brûle mal et encrasse le conduit ; on brûle du bois sous 20 % d'humidité.
    level: 7
    contexts: [periurbain, rural]
    title: Chauffage et cuisson au bois, deux hivers de bois d'avance rentrés avant novembre (un sec, un en séchage)
  - id: energie.autonomie
    level: 8
    contexts: [periurbain, rural]
    title: Autonomie électrique sur l'année (production et stockage)
  - id: energie.blackout
    level: 9
    title: Épreuve annuelle - 72 h disjoncteur général coupé, sans dommage ni improvisation
    why: Couper volontairement le courant transforme une panne subie en exercice maîtrisé.
    revalidate_days: 365
  - id: energie.lumiere
    level: 1
    title: Une source de lumière sans réseau rangée à un endroit connu de tous
    why: En cas de coupure de nuit, on doit pouvoir la trouver à tâtons, sans téléphone.
  - id: energie.station_1kwh
    level: 8
    contexts: [appartement]
    title: Station électrique d'au moins 1 kWh rechargée au solaire, couvrant une semaine de besoins prioritaires
  - id: energie.cuisson_sobre
    level: 4
    kind: skill
    title: Cuisson sobre pratiquée (marmite norvégienne, cuisson à l'étouffée, autocuiseur)
    why: Elle divise le combustible à stocker par deux ou trois.
    revalidate_days: 730
  - id: energie.ramonage
    due_month: 10
    level: 2
    title: Conduits de cheminée ou de poêle ramonés avant la saison de chauffe (certificat de l'année)
    why: Obligatoire, il évite le feu de cheminée et l'intoxication au CO, et conditionne l'assurance.
    requires_tags: [chauffage_bois]
  - id: energie.bois_hiver
    level: 4
    due_month: 11
    requires_tags: [chauffage_bois]
    title: Un hiver de bois sec rentré avant novembre (moins de 20 % d'humidité)
    why: Un foyer qui se chauffe au bois dépend de sa réserve dès le premier hiver ; les deux hivers d'avance viennent au niveau 7.
  - id: energie.cuisson_30j
    level: 5
    kind: stock
    contexts: [appartement]
    title: Combustible de cuisson pour 30 jours, en petite quantité et stocké en sécurité (cartouches à l'abri de la chaleur, hors cave, pièce aérée)
    why: En immeuble, des dizaines de cartouches de gaz sont un risque d'incendie ; la cuisson sobre fait durer la réserve.
    stock: {category: cuisson, min_days: 30}
