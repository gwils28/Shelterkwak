[project]
name = "shelterkwak"
version = "0.1.0"
description = "Suivi de la préparation et de l'autonomie d'un foyer (API et moteur)"
authors = [
    { name = "gwils28", email = "10559068+gwils28@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
shelterkwak = "shelterkwak.main:run"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # le formateur gère la longueur ; les chaînes longues restent lisibles

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
